# Replace the two URLs below with your own.
# - homepage: your organization's/agency's website
# - documentation: can simply point to this repo's README.md on GitHub
#   (e.g. https://github.com/<you>/<repo>/blob/main/README.md)
homepage: "https://your-organization-website.example.com"
documentation: "https://github.com/<your-github-username>/<your-repo-name>/blob/main/README.md"
versions:
  # Replace REPLACE_WITH_COMMIT_SHA with the commit SHA of the commit that
  # contains the final template.tpl you want published (see guide, step 3).
  - sha: REPLACE_WITH_COMMIT_SHA
    changeNotes: |
      Initial release. Consent Mode default-state tag (native per-type
      dropdowns, all types denied on first visit) with an optional loader
      for a self-hosted consent banner script (Accept All / Reject All /
      Necessary Only with expandable per-category checkboxes).
